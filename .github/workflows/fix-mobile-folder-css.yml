name: Fix mobile folder menu CSS

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-folder-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.commits[0].message != 'Remove mobile folder CSS workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile folder CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE FOLDER MENU FIX V2 */'
          if marker not in s:
              s += r'''

/* MOBILE FOLDER MENU FIX V2 */
.mobile-folder-bar { display:none; }
.mobile-folder-btn {
  width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:9px 13px; border:1px solid var(--border); border-radius:11px;
  background:var(--card-bg); color:var(--text); font-size:.82rem; font-weight:800;
}
.mobile-folder-btn:hover { border-color:var(--primary); }
@media (max-width:650px) {
  .workspace { position:relative; display:block !important; overflow:hidden; }
  .mobile-folder-bar { display:block !important; position:relative; z-index:200; padding:8px 10px 6px; background:var(--bg); border-bottom:1px solid var(--border); }
  .sidebar {
    position:absolute !important; top:58px; left:10px; right:10px; width:auto !important;
    height:auto !important; max-height:min(65dvh,440px); min-height:0 !important;
    padding:10px !important; display:none !important; flex:none !important; z-index:300;
    overflow-y:auto !important; overflow-x:hidden !important; border:1px solid var(--border) !important;
    border-radius:14px; background:var(--bg-soft); box-shadow:var(--shadow);
  }
  .sidebar.mobile-folder-open { display:block !important; }
  .sidebar-heading { display:flex !important; position:sticky; top:0; z-index:2; background:var(--bg-soft); padding:2px 5px 8px; }
  .category-list { display:block !important; width:100% !important; min-width:0 !important; height:auto !important; margin:0 !important; padding:0 !important; overflow:visible !important; }
  .folder-item, .category-list .folder-item {
    width:100% !important; min-width:0 !important; min-height:42px; height:42px; margin:0 0 4px !important;
    padding:8px 10px; display:flex !important;
  }
  .content-area { height:calc(100dvh - 58px); min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
}
'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git diff --cached --quiet || git commit -m 'Apply mobile folder menu CSS'
          git push
