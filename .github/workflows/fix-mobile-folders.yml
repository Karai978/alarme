name: Fix mobile folders

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-folders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile folder menu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <div class="workspace">\n        <aside class="sidebar" aria-label="Catégories">'''
          new = '''    <div class="workspace">\n        <div class="mobile-folder-bar">\n            <button id="mobileFolderBtn" class="mobile-folder-btn" type="button" onclick="toggleFolders()" aria-expanded="false" aria-controls="mobileFolderPanel">\n                <span>📁 Dossiers</span><span id="folderChevron">⌄</span>\n            </button>\n        </div>\n        <aside id="mobileFolderPanel" class="sidebar" aria-label="Catégories">'''
          if old not in s:
              raise SystemExit('index anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          anchor = "function setCategory(categoryId) {"
          fn = '''function toggleFolders() {\n    const panel = document.getElementById('mobileFolderPanel');\n    const button = document.getElementById('mobileFolderBtn');\n    const chevron = document.getElementById('folderChevron');\n    if (!panel || !button) return;\n    const open = panel.classList.toggle('mobile-folder-open');\n    button.setAttribute('aria-expanded', String(open));\n    if (chevron) chevron.textContent = open ? '⌃' : '⌄';\n}\n\nfunction closeFolders() {\n    const panel = document.getElementById('mobileFolderPanel');\n    const button = document.getElementById('mobileFolderBtn');\n    const chevron = document.getElementById('folderChevron');\n    if (!panel) return;\n    panel.classList.remove('mobile-folder-open');\n    if (button) button.setAttribute('aria-expanded', 'false');\n    if (chevron) chevron.textContent = '⌄';\n}\n\n'''
          if anchor not in s:
              raise SystemExit('script anchor not found')
          s = s.replace(anchor, fn + anchor, 1)
          old2 = "    renderList();\n}\n\nfunction addCategory() {"
          new2 = "    renderList();\n    closeFolders();\n}\n\nfunction addCategory() {"
          if old2 not in s:
              raise SystemExit('setCategory anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          anchor = "/* CSS moved from index.html inline style */"
          css = r'''/* Mobile folders: one button opens the complete folder list */\n.mobile-folder-bar { display:none; }\n.mobile-folder-btn {\n    width:100%;\n    min-height:44px;\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    padding:9px 13px;\n    border:1px solid var(--border);\n    border-radius:11px;\n    background:var(--card-bg);\n    color:var(--text);\n    font-size:.82rem;\n    font-weight:800;\n}\n.mobile-folder-btn:hover { border-color:var(--primary); }\n\n@media (max-width:650px) {\n    .workspace { position:relative; display:block; overflow:hidden; }\n    .mobile-folder-bar {\n        display:block;\n        position:relative;\n        z-index:40;\n        padding:8px 10px 6px;\n        background:var(--bg);\n        border-bottom:1px solid var(--border);\n    }\n    .sidebar {\n        position:absolute !important;\n        top:60px;\n        left:10px;\n        right:10px;\n        width:auto !important;\n        height:auto !important;\n        max-height:min(62dvh,420px);\n        min-height:0 !important;\n        padding:10px !important;\n        display:none !important;\n        flex:none !important;\n        z-index:100;\n        overflow-y:auto !important;\n        overflow-x:hidden !important;\n        border:1px solid var(--border) !important;\n        border-radius:14px;\n        background:var(--bg-soft);\n        box-shadow:var(--shadow);\n    }\n    .sidebar.mobile-folder-open { display:block !important; }\n    .sidebar-heading {\n        position:sticky;\n        top:0;\n        z-index:2;\n        background:var(--bg-soft);\n        padding:2px 5px 8px;\n    }\n    .category-list {\n        display:block !important;\n        width:100% !important;\n        min-width:0 !important;\n        height:auto !important;\n        margin:0 !important;\n        padding:0 !important;\n        overflow:visible !important;\n    }\n    .folder-item,\n    .category-list .folder-item {\n        width:100% !important;\n        min-width:0 !important;\n        min-height:42px;\n        height:42px;\n        margin:0 0 4px !important;\n        padding:8px 10px;\n        display:flex !important;\n    }\n    .content-area {\n        height:calc(100dvh - 60px);\n        min-height:0;\n        overflow-y:auto;\n        padding:14px 10px max(24px,env(safe-area-inset-bottom)) 10px;\n    }\n}\n\n'''
          if anchor in s:
              s = s.replace(anchor, css + anchor, 1)
          else:
              s += '\n' + css
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css
          git diff --cached --quiet || git commit -m "Show folders from a mobile button"
          git push
