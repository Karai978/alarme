name: Apply native layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-layout-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply CSS directly to style.css and clean service worker patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import urllib.request, json, base64, os
          api = 'https://api.github.com/repos/Karai978/alarme/contents/style.css?ref=main'
          req = urllib.request.Request(api, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          css = base64.b64decode(data['content']).decode('utf-8')
          marker = '/* NATIVE ANDROID NOTE LIST SCROLL FIX */'
          patch = r'''

/* NATIVE ANDROID NOTE LIST SCROLL FIX */
html, body { width:100%; height:100%; }
body { overflow:hidden; }
.app-shell { height:100dvh; min-height:0; overflow:hidden; }
.workspace { min-height:0; flex:1 1 auto; overflow:hidden; }
.content-area {
  min-width:0;
  min-height:0;
  flex:1 1 auto;
  height:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.content-header { flex:0 0 auto; }
.tag-bar { flex:0 0 auto; }
#emailList.notes-grid {
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  align-content:start;
  padding-bottom:max(30px, env(safe-area-inset-bottom));
  scrollbar-width:thin;
}
@media (max-width:720px) {
  .content-area { padding-bottom:max(8px, env(safe-area-inset-bottom)); }
  #emailList.notes-grid { gap:11px; }
}
@media (max-width:390px) {
  #emailList.notes-grid { gap:9px; }
}
'''
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'
          Path('style.css').write_text(css.rstrip() + patch, encoding='utf-8')

          clean_sw = """const CACHE_NAME = 'notes-alarme-complet-v14';
const ASSETS_TO_CACHE = ['./','./index.html','./style.css','./script.js','./manifest.json','./alarm.mp3','./icon-192.png','./icon-512.png'];
self.addEventListener('install', (event) => { event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS_TO_CACHE))); self.skipWaiting(); });
self.addEventListener('activate', (event) => { event.waitUntil(caches.keys().then((names) => Promise.all(names.map((name) => name !== CACHE_NAME ? caches.delete(name) : undefined)))); self.clients.claim(); });
self.addEventListener('fetch', (event) => { event.respondWith(caches.match(event.request).then((cached) => cached || fetch(event.request))); });
"""
          Path('sw.js').write_text(clean_sw, encoding='utf-8')
          PY
      - name: Commit native CSS and clean service worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css sw.js
          git diff --cached --quiet || git commit -m "Apply native CSS note list scrolling fix"
          git push
