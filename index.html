<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Notes & Alarme - Individuel</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --modal-bg: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #f1f5f9;
            font-weight: 700;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .controls button {
            flex: 1;
            padding: 12px 10px;
            font-size: 0.9rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: var(--success);
        }
        .btn-success:hover {
            background: var(--success-hover);
        }
        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }

        /* --- LISTE DES EMAILS --- */
        .email-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .email-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .email-item:hover {
            border-color: var(--primary);
            background: #253349;
        }

        .email-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .email-text {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
        }

        .email-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .email-item.triggered {
            border-color: var(--danger);
            animation: pulse-border 1.2s infinite alternate;
        }

        @keyframes pulse-border {
            from { background-color: #1e293b; border-color: var(--danger); }
            to { background-color: #450a0a; border-color: #f87171; }
        }

        /* --- TABLEAU FLOTTANT (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--modal-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #f1f5f9;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="email"], input[type="datetime-local"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            color-scheme: dark;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .modal-alarm-btn {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        .btn-cancel {
            background: #334155;
        }
        .btn-cancel:hover {
            background: #475569;
        }

        @media (min-width: 640px) {
            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .controls {
                width: auto;
            }
            .controls button {
                flex: none;
            }
            h1 {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>📧 Liste des E-mails</h1>
            <div class="controls">
                <button class="btn-success" onclick="enableAudio()">🔔 Activer le son global</button>
                <button onclick="openModal()">+ Ajouter</button>
            </div>
        </div>

        <!-- Liste principale des adresses e-mail -->
        <div id="emailList" class="email-list">
            <!-- Rempli dynamiquement -->
        </div>
    </div>

    <!-- Tableau flottant (Modal) -->
    <div id="noteModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" id="modalTitleHeading">Détails de la note</h2>
            
            <div class="input-group">
                <label>Adresse Mail</label>
                <input type="email" id="modalEmail" placeholder="nom@exemple.com">
            </div>

            <div class="input-group">
                <label>Date & Heure</label>
                <input type="datetime-local" id="modalDatetime">
            </div>

            <div class="input-group">
                <label>Description</label>
                <input type="text" id="modalDesc" placeholder="Détails de la note...">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="modalChecked">
                <span>Marquer comme terminé (État)</span>
            </div>

            <!-- Bouton d'activation d'alarme individuel -->
            <button type="button" id="modalAlarmBtn" class="modal-alarm-btn btn-success" onclick="toggleModalAlarm()">🔔 Activer l'alarme</button>

            <div class="modal-actions">
                <button class="btn-danger" id="modalDeleteBtn" onclick="deleteCurrentNote()">Delete</button>
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-success" onclick="saveCurrentNote()">Save</button>
            </div>
        </div>
    </div>

    <audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>

    <script>
        let audioPermissionGranted = false;
        let notesData = [];
        let currentEditIndex = null; 
        let currentAlarmEnabled = false; // État local de l'alarme dans la modale

        function enableAudio() {
            const audio = document.getElementById("alarmAudio");
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                audioPermissionGranted = true;
                alert("✨ Sonneries globales activées !");
            }).catch(err => console.error("Erreur audio:", err));

            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            renderList();
            setInterval(checkAlarms, 5000);
        });

        function loadData() {
            const saved = localStorage.getItem("pwa_notes_data");
            if (saved) {
                try {
                    notesData = JSON.parse(saved);
                } catch (e) {
                    notesData = [];
                }
            }
            if (notesData.length === 0) {
                notesData = [{ checked: false, email: 'exemple@domaine.com', datetime: '', desc: 'Première note', triggered: false, alarmEnabled: false }];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem("pwa_notes_data", JSON.stringify(notesData));
        }

        function renderList() {
            const listContainer = document.getElementById("emailList");
            listContainer.innerHTML = "";

            notesData.forEach((note, index) => {
                const item = document.createElement("div");
                item.className = "email-item";
                if (note.triggered && note.alarmEnabled) {
                    item.classList.add("triggered");
                }

                const displayEmail = note.email ? note.email : "(Sans adresse mail)";
                const displayDesc = note.desc ? note.desc : "Aucune description";
                const displayTime = note.datetime ? note.datetime.replace('T', ' à ') : "Pas d'alarme";
                const alarmIcon = note.alarmEnabled ? "🔔 Activée" : "🔕 Désactivée";

                item.innerHTML = `
                    <div class="email-info">
                        <span class="email-text">${displayEmail}</span>
                        <span class="email-meta">${displayDesc} — 🕒 ${displayTime} | ${alarmIcon}</span>
                    </div>
                    <span style="color: var(--text-secondary); font-size: 1.2rem;">›</span>
                `;

                item.onclick = () => openModal(index);
                listContainer.appendChild(item);
            });
        }

        function openModal(index = null) {
            currentEditIndex = index;
            const modal = document.getElementById("noteModal");
            const heading = document.getElementById("modalTitleHeading");
            const deleteBtn = document.getElementById("modalDeleteBtn");

            if (index !== null) {
                heading.textContent = "Modifier la note";
                deleteBtn.style.display = "block";
                const note = notesData[index];
                document.getElementById("modalEmail").value = note.email || '';
                document.getElementById("modalDatetime").value = note.datetime || '';
                document.getElementById("modalDesc").value = note.desc || '';
                document.getElementById("modalChecked").checked = note.checked || false;
                currentAlarmEnabled = note.alarmEnabled || false;
            } else {
                heading.textContent = "Nouvelle note";
                deleteBtn.style.display = "none";
                document.getElementById("modalEmail").value = '';
                document.getElementById("modalDatetime").value = '';
                document.getElementById("modalDesc").value = '';
                document.getElementById("modalChecked").checked = false;
                currentAlarmEnabled = false; // Par défaut désactivé pour une nouvelle note
            }

            updateAlarmButtonUI();
            modal.classList.add("active");
        }

        function toggleModalAlarm() {
            currentAlarmEnabled = !currentAlarmEnabled;
            updateAlarmButtonUI();
        }

        function updateAlarmButtonUI() {
            const btn = document.getElementById("modalAlarmBtn");
            if (currentAlarmEnabled) {
                btn.textContent = "🔕 Désactiver l'alarme";
                btn.className = "modal-alarm-btn btn-danger";
            } else {
                btn.textContent = "🔔 Activer l'alarme";
                btn.className = "modal-alarm-btn btn-success";
            }
        }

        function closeModal() {
            document.getElementById("noteModal").classList.remove("active");
            currentEditIndex = null;
        }

        function saveCurrentNote() {
            const email = document.getElementById("modalEmail").value;
            const datetime = document.getElementById("modalDatetime").value;
            const desc = document.getElementById("modalDesc").value;
            const checked = document.getElementById("modalChecked").checked;

            if (currentEditIndex !== null) {
                if (notesData[currentEditIndex].datetime !== datetime) {
                    notesData[currentEditIndex].triggered = false;
                }
                notesData[currentEditIndex] = { 
                    ...notesData[currentEditIndex], 
                    email, 
                    datetime, 
                    desc, 
                    checked, 
                    alarmEnabled: currentAlarmEnabled 
                };
            } else {
                notesData.push({ 
                    checked, 
                    email, 
                    datetime, 
                    desc, 
                    triggered: false, 
                    alarmEnabled: currentAlarmEnabled 
                });
            }

            saveData();
            renderList();
            closeModal();
        }

        function deleteCurrentNote() {
            if (currentEditIndex !== null) {
                if (confirm("Voulez-vous vraiment supprimer cette note ?")) {
                    notesData.splice(currentEditIndex, 1);
                    saveData();
                    renderList();
                    closeModal();
                }
            }
        }

        function checkAlarms() {
            const now = new Date();
            const nowFormatted = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + 'T' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');

            let updated = false;

            notesData.forEach(note => {
                // L'alarme ne se déclenche que si elle est activée individuellement (alarmEnabled === true)
                if (note.alarmEnabled && note.datetime && note.datetime <= nowFormatted && !note.triggered) {
                    note.triggered = true;
                    updated = true;

                    if (audioPermissionGranted) {
                        const audio = document.getElementById("alarmAudio");
                        audio.play();
                    }

                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("⏰ Rappel d'alarme !", {
                            body: note.desc || note.email || "L'heure programmée est atteinte.",
                            icon: "icon-192.png"
                        });
                    }

                    alert("⏰ ALARME ACTIVÉE !\n\nE-mail : " + (note.email || "N/A") + "\nDescription : " + (note.desc || "Aucune"));
                }
            });

            if (updated) {
                saveData();
                renderList();
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker enregistré'))
                    .catch((err) => console.error('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
