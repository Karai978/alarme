<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Notes & Alarme Pro - Dark Mode</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #0f172a;               /* Fond principal sombre (Slate 900) */
            --card-bg: #1e293b;          /* Fond de la carte (Slate 800) */
            --text: #f8fafc;             /* Texte clair principal */
            --text-secondary: #94a3b8;   /* Texte secondaire */
            --border: #334155;           /* Bordures sombres */
            --input-bg: #0f172a;         /* Fond des zones de saisie */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #f1f5f9;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-success {
            background: var(--success);
        }
        .btn-success:hover {
            background: var(--success-hover);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            background-color: #0f172a;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        input[type="text"], input[type="email"], input[type="datetime-local"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 0.95rem;
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            color-scheme: dark; /* Force l'icône calendrier/heure en clair */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder, input[type="email"]::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* État Alarme Déclenchée (Mode Sombre) */
        tr.triggered {
            background-color: #450a0a !important;
            animation: pulse-dark 1.2s infinite alternate;
        }

        @keyframes pulse-dark {
            from { background-color: #450a0a; }
            to { background-color: #7f1d1d; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>📋 Notes & Alarmes (Dark)</h1>
            <div class="controls">
                <button class="btn-success" onclick="enableAudio()">🔔 Activer le son</button>
                <button onclick="addRow()">+ Nouvelle ligne</button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="notesTable">
                <thead>
                    <tr>
                        <th style="width: 6%; text-align: center;">État</th>
                        <th style="width: 28%;">Adresse Mail</th>
                        <th style="width: 26%;">Date & Heure</th>
                        <th style="width: 34%;">Description</th>
                        <th style="width: 6%; text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Généré dynamiquement -->
                </tbody>
            </table>
        </div>
    </div>

    <audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>

    <script>
        let audioPermissionGranted = false;

        function enableAudio() {
            const audio = document.getElementById("alarmAudio");
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                audioPermissionGranted = true;
                alert("✨ Alarmes sonores activées avec succès !");
            }).catch(err => {
                console.error("Erreur audio:", err);
            });

            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadTable();
            setInterval(checkAlarms, 5000);
        });

        function addRow(data = { checked: false, email: '', datetime: '', desc: '', triggered: false }) {
            const tbody = document.getElementById("tableBody");
            const row = document.createElement("tr");

            if (data.triggered) {
                row.classList.add("triggered");
            }

            row.innerHTML = `
                <td style="text-align: center;">
                    <input type="checkbox" ${data.checked ? 'checked' : ''} onchange="saveTable()">
                </td>
                <td>
                    <input type="email" value="${data.email || ''}" placeholder="nom@exemple.com" oninput="saveTable()">
                </td>
                <td>
                    <input type="datetime-local" value="${data.datetime || ''}" onchange="resetAlarm(this); saveTable();">
                </td>
                <td>
                    <input type="text" value="${data.desc || ''}" placeholder="Ajouter une description..." oninput="saveTable()">
                </td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteRow(this)" title="Supprimer">✕</button>
                </td>
            `;

            tbody.appendChild(row);
            saveTable();
        }

        function resetAlarm(input) {
            const row = input.closest("tr");
            row.classList.remove("triggered");
            delete row.dataset.triggered;
            saveTable();
        }

        function deleteRow(button) {
            button.closest("tr").remove();
            saveTable();
        }

        function saveTable() {
            const rows = document.querySelectorAll("#tableBody tr");
            const data = [];

            rows.forEach(row => {
                const checked = row.querySelector("input[type='checkbox']").checked;
                const email = row.querySelector("input[type='email']").value;
                const datetime = row.querySelector("input[type='datetime-local']").value;
                const desc = row.querySelector("input[type='text']").value;
                const triggered = row.dataset.triggered === "true";

                data.push({ checked, email, datetime, desc, triggered });
            });

            localStorage.setItem("pwa_notes_data", JSON.stringify(data));
        }

        function loadTable() {
            const savedData = JSON.parse(localStorage.getItem("pwa_notes_data"));
            if (savedData && savedData.length > 0) {
                savedData.forEach(row => addRow(row));
            } else {
                addRow();
            }
        }

        function checkAlarms() {
            const rows = document.querySelectorAll("#tableBody tr");
            const now = new Date();
            const nowFormatted = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + 'T' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');

            rows.forEach(row => {
                const datetimeInput = row.querySelector("input[type='datetime-local']");
                const descInput = row.querySelector("input[type='text']");
                const targetTime = datetimeInput.value;

                if (targetTime && targetTime <= nowFormatted && row.dataset.triggered !== "true") {
                    row.dataset.triggered = "true";
                    row.classList.add("triggered");
                    
                    if (audioPermissionGranted) {
                        const audio = document.getElementById("alarmAudio");
                        audio.play();
                    }

                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("⏰ Rappel d'alarme !", {
                            body: descInput.value || "L'heure programmée est atteinte.",
                            icon: "icon-192.png"
                        });
                    }

                    alert("⏰ ALARME ACTIVÉE !\n\nDescription : " + (descInput.value || "Aucune description"));
                    saveTable();
                }
            });
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker enregistré'))
                    .catch((err) => console.error('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
