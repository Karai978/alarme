<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Notes & Alarme - Version Complète</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <h1>📧 E-mails & Alarmes</h1>
                <div class="header-actions">
                    <button class="btn-icon" onclick="toggleTheme()" title="Changer de thème">☀️/🌙</button>
                </div>
            </div>

            <!-- Contrôles globaux -->
            <div class="controls">
                <button class="btn-success" onclick="enableAudio()">🔔 Activer le son</button>
                <button onclick="openModal()">+ Ajouter</button>
            </div>

            <!-- Barre de recherche -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Rechercher par e-mail ou description..." oninput="handleSearch()">
            </div>

            <!-- Onglets de filtrage -->
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="setFilter('all', this)">Tous</button>
                <button class="tab-btn" onclick="setFilter('pending', this)">En cours</button>
                <button class="tab-btn" onclick="setFilter('completed', this)">Terminées</button>
                <button class="tab-btn" onclick="setFilter('active-alarm', this)">Alarmes actives</button>
            </div>

            <!-- Actions de données & Audio personnalisé -->
            <div class="data-tools">
                <button class="btn-secondary" onclick="exportJSON()">Export JSON</button>
                <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
                <label class="btn-secondary file-label">
                    Import <input type="file" id="importFile" accept=".json,.csv" onchange="importData(event)" hidden>
                </label>
            </div>
            <div class="audio-picker-container">
                <label class="audio-label">Son personnalisé (MP3/WAV) :</label>
                <input type="file" id="customAudioInput" accept="audio/*" onchange="setCustomAudio(event)">
            </div>
        </div>

        <!-- Liste principale -->
        <div id="emailList" class="email-list">
            <!-- Rempli dynamiquement -->
        </div>
    </div>

    <!-- Tableau flottant (Modal de création/modification) -->
    <div id="noteModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" id="modalTitleHeading">Détails de la note</h2>
            
            <div class="input-group">
                <label>Adresse Mail</label>
                <input type="email" id="modalEmail" placeholder="nom@exemple.com">
            </div>

            <div class="input-group">
                <label>Date & Heure</label>
                <input type="datetime-local" id="modalDatetime">
            </div>

            <div class="input-group">
                <label>Description</label>
                <input type="text" id="modalDesc" placeholder="Détails de la note...">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="modalChecked">
                <span>Marquer comme terminé (État)</span>
            </div>

            <button type="button" id="modalAlarmBtn" class="modal-alarm-btn btn-success" onclick="toggleModalAlarm()">🔔 Activer l'alarme</button>

            <div class="modal-actions">
                <button class="btn-danger" id="modalDeleteBtn" onclick="deleteCurrentNote()">Delete</button>
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-success" onclick="saveCurrentNote()">Save</button>
            </div>
        </div>
    </div>

    <!-- Écran d'alarme active (Snooze / Stop) -->
    <div id="alarmOverlay" class="alarm-overlay">
        <div class="alarm-alert-card">
            <div class="alarm-pulse-icon">⏰</div>
            <h2>ALARME DÉCLENCHÉE !</h2>
            <p id="alarmAlertInfo" class="alarm-info-text">Détails...</p>
            <div class="alarm-alert-actions">
                <button class="btn-danger" onclick="stopActiveAlarm()">Stopper</button>
                <button class="btn-warning" onclick="snoozeActiveAlarm(5)">Snooze +5 min</button>
                <button class="btn-secondary" onclick="snoozeActiveAlarm(10)">Snooze +10 min</button>
            </div>
        </div>
    </div>

    <audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker enregistré'))
                    .catch((err) => console.error('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
