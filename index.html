<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Notes & Alarme Mobile</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #0f172a;               /* Fond sombre Slate 900 */
            --card-bg: #1e293b;          /* Fond des éléments Slate 800 */
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #f1f5f9;
            font-weight: 700;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .controls button {
            flex: 1;
            padding: 12px 10px;
            font-size: 0.9rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: var(--success);
        }

        /* --- STYLES DES INPUTS --- */
        input[type="text"], input[type="email"], input[type="datetime-local"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            color-scheme: dark;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* --- LISTE ET CARTES MOBILE --- */
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* --- ALARME DÉCLENCHÉE --- */
        .note-card.triggered {
            border-color: var(--danger);
            animation: pulse-border 1.2s infinite alternate;
        }

        @keyframes pulse-border {
            from { background-color: #1e293b; border-color: var(--danger); }
            to { background-color: #450a0a; border-color: #f87171; }
        }

        /* Mode Ordinateur / Tablette (Écran large) */
        @media (min-width: 640px) {
            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .controls {
                width: auto;
            }
            .controls button {
                flex: none;
            }
            h1 {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>📋 Mes Notes & Alarmes</h1>
            <div class="controls">
                <button class="btn-success" onclick="enableAudio()">🔔 Activer le son</button>
                <button onclick="addRow()">+ Ajouter</button>
            </div>
        </div>

        <!-- Conteneur des cartes mobile -->
        <div id="notesContainer" class="notes-list">
            <!-- Généré dynamiquement -->
        </div>
    </div>

    <audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>

    <script>
        let audioPermissionGranted = false;

        function enableAudio() {
            const audio = document.getElementById("alarmAudio");
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                audioPermissionGranted = true;
                alert("✨ Sonneries activées sur votre mobile !");
            }).catch(err => console.error("Erreur audio:", err));

            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadTable();
            setInterval(checkAlarms, 5000);
        });

        function addRow(data = { checked: false, email: '', datetime: '', desc: '', triggered: false }) {
            const container = document.getElementById("notesContainer");
            const card = document.createElement("div");
            card.className = "note-card";

            if (data.triggered) {
                card.classList.add("triggered");
            }

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-status">
                        <input type="checkbox" ${data.checked ? 'checked' : ''} onchange="saveTable()">
                        <span>Terminé</span>
                    </div>
                    <button class="btn-delete" onclick="deleteCard(this)">Supprimer</button>
                </div>

                <div class="input-group">
                    <label>Adresse Mail</label>
                    <input type="email" value="${data.email || ''}" placeholder="nom@exemple.com" oninput="saveTable()">
                </div>

                <div class="input-group">
                    <label>Date & Heure d'alarme</label>
                    <input type="datetime-local" value="${data.datetime || ''}" onchange="resetAlarm(this); saveTable();">
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <input type="text" value="${data.desc || ''}" placeholder="Détails de la note..." oninput="saveTable()">
                </div>
            `;

            container.appendChild(card);
            saveTable();
        }

        function resetAlarm(input) {
            const card = input.closest(".note-card");
            card.classList.remove("triggered");
            delete card.dataset.triggered;
            saveTable();
        }

        function deleteCard(button) {
            button.closest(".note-card").remove();
            saveTable();
        }

        function saveTable() {
            const cards = document.querySelectorAll(".note-card");
            const data = [];

            cards.forEach(card => {
                const checked = card.querySelector("input[type='checkbox']").checked;
                const email = card.querySelector("input[type='email']").value;
                const datetime = card.querySelector("input[type='datetime-local']").value;
                const desc = card.querySelector("input[type='text']").value;
                const triggered = card.dataset.triggered === "true";

                data.push({ checked, email, datetime, desc, triggered });
            });

            localStorage.setItem("pwa_notes_data", JSON.stringify(data));
        }

        function loadTable() {
            const savedData = JSON.parse(localStorage.getItem("pwa_notes_data"));
            if (savedData && savedData.length > 0) {
                savedData.forEach(row => addRow(row));
            } else {
                addRow();
            }
        }

        function checkAlarms() {
            const cards = document.querySelectorAll(".note-card");
            const now = new Date();
            const nowFormatted = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + 'T' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');

            cards.forEach(card => {
                const datetimeInput = card.querySelector("input[type='datetime-local']");
                const descInput = card.querySelector("input[type='text']");
                const targetTime = datetimeInput.value;

                if (targetTime && targetTime <= nowFormatted && card.dataset.triggered !== "true") {
                    card.dataset.triggered = "true";
                    card.classList.add("triggered");
                    
                    if (audioPermissionGranted) {
                        const audio = document.getElementById("alarmAudio");
                        audio.play();
                    }

                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("⏰ Rappel d'alarme !", {
                            body: descInput.value || "L'heure programmée est atteinte.",
                            icon: "icon-192.png"
                        });
                    }

                    alert("⏰ ALARME ACTIVÉE !\n\nNote : " + (descInput.value || "Aucune description"));
                    saveTable();
                }
            });
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker enregistré'))
                    .catch((err) => console.error('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
