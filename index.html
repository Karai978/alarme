<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Notes & Alarmes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div class="brand-row">
            <div class="brand-mark">✓</div>
            <div class="brand-text">
                <h1>Notes</h1>
                <span id="noteCountLabel">0 notes</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" onclick="enableAudio()" title="Activer le son" aria-label="Activer le son">🔔</button>
                <button id="mobileFolderBtn" class="icon-btn folder-icon-btn" type="button" onclick="toggleFolders()" title="Dossiers" aria-label="Dossiers" aria-expanded="false" aria-controls="mobileFolderPanel">📁</button>
                <button class="icon-btn" onclick="openModal()" title="Nouvelle note" aria-label="Nouvelle note">＋</button>
                <button class="icon-btn" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><span id="themeIcon">☀️</span></button>
            </div>
        </div>
        <div class="search-filter-row">
            <div class="search-wrap"><span class="search-icon">⌕</span><input id="searchInput" type="search" autocomplete="off" placeholder="Rechercher dans vos notes..." oninput="handleSearch()"><button id="clearSearchBtn" class="clear-search" onclick="clearSearch()" aria-label="Effacer la recherche">×</button></div>
            <div class="filter-select-wrap"><select id="filterSelect" class="filter-select" aria-label="Filtrer les notes" onchange="setFilter(this.value, this.options[this.selectedIndex].text)"><option value="todo">📋 À faire</option><option value="favorite">★ Favoris</option><option value="pinned">📌 Épinglés</option><option value="waiting">⏳ En attente</option><option value="done">✓ Terminées</option></select></div>
        </div>
        <div class="smart-filters" role="tablist" aria-label="Filtres"><button class="filter-chip active" data-filter="todo">À faire</button><button class="filter-chip" data-filter="favorite">★ Favoris</button><button class="filter-chip" data-filter="pinned">📌 Épinglés</button><button class="filter-chip" data-filter="waiting">⏳ En attente</button><button class="filter-chip" data-filter="done">✓ Terminées</button></div>
    </header>
    <div class="workspace">
        <aside id="mobileFolderPanel" class="sidebar" aria-label="Catégories">
            <div class="sidebar-heading"><span>Dossiers</span><button class="mini-btn" onclick="addCategory()" title="Ajouter un dossier">＋</button></div>
            <button class="folder-item active" data-category="all" onclick="setCategory('all')"><span>▦</span><span>Toutes les notes</span><b id="allCount">0</b></button>
            <div id="categoryList" class="category-list"></div>
        </aside>
        <main class="content-area">
            <div class="content-header"><div><h2 id="viewTitle">À faire</h2><span id="viewSubtitle">Vos notes actives</span></div><div class="content-tools"><button class="small-action" onclick="openSortMenu(event)" title="Trier">↕ Trier</button><div id="sortMenu" class="sort-menu"><button onclick="setSort('updated')">Dernière modification</button><button onclick="setSort('date')">Date d’alarme</button><button onclick="setSort('title')">Titre</button><button onclick="setSort('color')">Couleur</button></div></div></div>
            <div id="tagBar" class="tag-bar"></div><section id="emailList" class="notes-grid" aria-live="polite"></section>
        </main>
    </div>
</div>
<div id="noteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitleHeading">
    <div class="modal-card">
        <div class="modal-header"><div><span class="eyebrow">NOTE</span><h2 id="modalTitleHeading">Nouvelle note</h2></div><button class="modal-close" onclick="closeModal()" aria-label="Fermer">×</button></div>
        <div class="input-group"><label for="modalEmail">Titre / Adresse mail</label><input type="text" id="modalEmail" placeholder="Ex. Appeler le client ou nom@exemple.com"></div>
        <div class="input-row"><div class="input-group"><label for="modalCategory">Dossier</label><select id="modalCategory"></select></div><div class="input-group"><label for="modalDatetime">Date & heure</label><input type="datetime-local" id="modalDatetime"></div></div>
        <div class="input-group"><label for="modalDesc">Description</label><textarea id="modalDesc" rows="3" placeholder="Écrivez votre note..." spellcheck="true"></textarea></div>
        <div class="status-feature-row"><div class="input-group"><label for="modalStatus">Statut</label><select id="modalStatus"><option value="not_started">○ Pas démarré</option><option value="waiting">⏳ En attente</option><option value="done">✓ Terminé</option></select></div><div><span class="feature-panel-label">Options</span><div class="feature-row"><button id="favoriteBtn" class="feature-toggle" onclick="toggleNoteFlag('favorite')">☆ <span>Favori</span></button><button id="pinnedBtn" class="feature-toggle" onclick="toggleNoteFlag('pinned')">📌 <span>Épingler</span></button></div></div></div>
        <div class="input-group"><label for="modalTags">Tags</label><input type="text" id="modalTags" placeholder="travail, urgent, client..."><small>Séparez les tags par des virgules.</small></div>
        <div class="color-section"><label for="colorPicker">Couleur de la note</label><select id="colorPicker" aria-label="Couleur de la note"></select></div>
        <div class="attachment-section"><div class="attachment-header"><span>Pièces jointes</span><label class="attachment-add-btn">＋ Ajouter<input type="file" id="attachmentInput" accept=".md,.txt,.json,text/markdown,text/plain,application/json" hidden onchange="addAttachment(event)"></label></div><div id="attachmentList" class="attachment-list"><span class="empty-attachments">Aucune pièce jointe</span></div></div>
        <button type="button" id="modalAlarmBtn" class="modal-alarm-btn btn-success" onclick="toggleModalAlarm()">🔔 Activer l’alarme</button>
        <div class="modal-actions"><button class="btn-danger" id="modalDeleteBtn" onclick="deleteCurrentNote()">Supprimer</button><button class="btn-cancel" onclick="closeModal()">Annuler</button><button class="btn-primary" onclick="saveCurrentNote()">Enregistrer</button></div>
    </div>
</div>
<div id="alarmOverlay" class="alarm-overlay"><div class="alarm-alert-card"><div class="alarm-pulse-icon">⏰</div><span class="eyebrow">RAPPEL</span><h2>Alarme déclenchée</h2><p id="alarmAlertInfo" class="alarm-info-text">Détails...</p><div class="alarm-alert-actions"><button class="btn-danger" onclick="stopActiveAlarm()">Stopper</button><button class="btn-warning" onclick="snoozeActiveAlarm(5)">Snooze +5 min</button><button class="btn-secondary" onclick="snoozeActiveAlarm(10)">Snooze +10 min</button></div></div></div>
<div id="toastContainer" class="toast-container" aria-live="polite"></div>
<audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>
<script src="script.js"></script>
<script>
const NOTE_COLOR_LABELS = { default:'⚪ Gris / Standard', blue:'🔵 Bleu', green:'🟢 Vert', yellow:'🟡 Jaune', red:'🔴 Rouge', purple:'🟣 Violet', pink:'🩷 Rose' };
function renderColorPicker() { const picker=document.getElementById('colorPicker'); if(!picker)return; picker.innerHTML=Object.entries(NOTE_COLOR_LABELS).map(([value,label])=>`<option value="${value}">${label}</option>`).join(''); picker.value=currentNoteColor; picker.onchange=()=>{currentNoteColor=picker.value;}; }
function selectNoteColor(color) { currentNoteColor=color; const picker=document.getElementById('colorPicker'); if(picker)picker.value=color; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(reg=>console.log('Service Worker enregistré:',reg.scope)).catch(err=>console.error('Erreur SW:',err)); }
</script>
</body>
</html>
