<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Notes & Alarmes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <h1>📝 Note</h1>
                <div class="header-actions">
                    <button class="btn-icon" onclick="enableAudio()" title="Activer le son" aria-label="Activer le son">🔔</button>
                    <button class="btn-icon" onclick="openModal()" title="Ajouter une note" aria-label="Ajouter une note">＋</button>
                    <button class="btn-icon theme-btn" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><span class="theme-sun">☀️</span><span class="theme-slash">/</span><span class="theme-moon">🌙</span></button>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Rechercher une note..." oninput="handleSearch()">
            </div>

            <div class="filter-tabs">
                <div class="dropdown">
                    <button id="filterDropdownBtn" class="tab-btn dropdown-btn" onclick="toggleDropdown(event, 'filterDropdown')">📌 À faire ▾</button>
                    <div id="filterDropdown" class="dropdown-content">
                        <button onclick="setFilter('todo', 'À faire')">📋 À faire</button>
                        <button onclick="setFilter('not_started', 'Pas démarré')">○ Pas démarré</button>
                        <button onclick="setFilter('waiting', 'En attente')">⏳ En attente</button>
                        <button onclick="setFilter('done', 'Terminé')">✓ Terminé</button>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="tab-btn dropdown-btn" onclick="toggleDropdown(event, 'plusDropdown')">⚙️ Plus ▾</button>
                    <div id="plusDropdown" class="dropdown-content">
                        <button onclick="exportJSON()">💾 Export JSON</button>
                        <button onclick="exportCSV()">📊 Export CSV</button>
                        <label class="dropdown-item-label">
                            📂 Importer un fichier
                            <input type="file" id="importFile" accept=".json,.csv" onchange="importData(event)" hidden>
                        </label>
                        <label class="dropdown-item-label">
                            🎵 Son personnalisé
                            <input type="file" id="customAudioInput" accept="audio/*" onchange="setCustomAudio(event)" hidden>
                        </label>
                    </div>
                </div>
            </div>
        </header>

        <main id="emailList" class="email-list" aria-live="polite"></main>
    </div>

    <div id="noteModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" id="modalTitleHeading">Détails de la note</h2>

            <div class="input-group">
                <label for="modalEmail">Adresse Mail</label>
                <input type="email" id="modalEmail" placeholder="nom@exemple.com">
            </div>

            <div class="input-group">
                <label for="modalDatetime">Date & Heure</label>
                <input type="datetime-local" id="modalDatetime">
            </div>

            <div class="input-group">
                <label for="modalDesc">Description</label>
                <textarea id="modalDesc" rows="7" placeholder="Écrivez votre note..." spellcheck="true"></textarea>
            </div>

            <div class="input-group">
                <label for="modalStatus">Statut</label>
                <select id="modalStatus">
                    <option value="not_started">○ Pas démarré</option>
                    <option value="waiting">⏳ En attente</option>
                    <option value="done">✓ Terminé</option>
                </select>
            </div>

            <div class="attachment-section">
                <div class="attachment-header">
                    <span>Pièces jointes</span>
                    <label class="attachment-add-btn" title="Ajouter une pièce jointe">
                        ＋ Ajouter
                        <input type="file" id="attachmentInput" accept=".md,.txt,.json,text/markdown,text/plain,application/json" hidden onchange="addAttachment(event)">
                    </label>
                </div>
                <div id="attachmentList" class="attachment-list">
                    <span class="empty-attachments">Aucune pièce jointe</span>
                </div>
            </div>

            <button type="button" id="modalAlarmBtn" class="modal-alarm-btn btn-success" onclick="toggleModalAlarm()">🔔 Activer l'alarme</button>

            <div class="modal-actions">
                <button class="btn-danger" id="modalDeleteBtn" onclick="deleteCurrentNote()">Supprimer</button>
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-success" onclick="saveCurrentNote()">Enregistrer</button>
            </div>
        </div>
    </div>

    <div id="alarmOverlay" class="alarm-overlay">
        <div class="alarm-alert-card">
            <div class="alarm-pulse-icon">⏰</div>
            <h2>ALARME DÉCLENCHÉE !</h2>
            <p id="alarmAlertInfo" class="alarm-info-text">Détails...</p>
            <div class="alarm-alert-actions">
                <button class="btn-danger" onclick="stopActiveAlarm()">Stopper</button>
                <button class="btn-warning" onclick="snoozeActiveAlarm(5)">Snooze +5 min</button>
                <button class="btn-secondary" onclick="snoozeActiveAlarm(10)">Snooze +10 min</button>
            </div>
        </div>
    </div>

    <audio id="alarmAudio" src="alarm.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
    <script>
        // Register early so PWA analyzers can detect the service worker reliably.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then((registration) => console.log('Service Worker enregistré:', registration.scope))
                .catch((err) => console.error('Erreur SW:', err));
        }
    </script>
</body>
</html>
